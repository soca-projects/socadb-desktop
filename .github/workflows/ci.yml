name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Keep in sync with build.yml and release.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # Catches Vite-specific failures (asset resolution, plugin config) that
      # `tsc --noEmit` misses. Cheaper than running the full Tauri bundle on
      # every PR while still failing fast on broken frontend builds.
      - name: Build (Vite)
        run: bun run build

      - name: Test
        run: bun run test

  mcp-server:
    name: MCP server checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Keep in sync with build.yml and release.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp-server
        run: bunx tsc --noEmit

      - name: Check the bundled Codex CLI
        working-directory: mcp-server
        run: bun run check:codex

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Create MCP placeholders for Tauri resource globs
        run: |
          mkdir -p mcp-server/dist mcp-server/dist/runtime
          touch mcp-server/dist/socadb-mcp-linux-x64
          touch mcp-server/dist/runtime/.placeholder

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Run cargo-audit directly so it picks up src-tauri/.cargo/audit.toml.
      # The rustsec/audit-check action ignores that config file, which is
      # why Tauri/Cloudflare/Firecracker bypass it.
      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  rust-macos:
    name: Rust checks (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # The Sparkle plugin's build.rs links against it, so cargo fails without it.
      - name: Download Sparkle.framework
        run: ./scripts/macos/download-sparkle.sh

      - name: Create MCP placeholders for Tauri resource globs
        run: |
          mkdir -p mcp-server/dist mcp-server/dist/runtime
          touch mcp-server/dist/socadb-mcp-darwin-arm64
          touch mcp-server/dist/runtime/.placeholder

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The test binary finds Sparkle through an rpath that only resolves inside
      # the app bundle.
      - name: Test
        working-directory: src-tauri
        run: DYLD_FRAMEWORK_PATH="$PWD" cargo test --lib
