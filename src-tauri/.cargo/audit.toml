[advisories]
ignore = [
  # gtk-rs GTK3 bindings — the entire gtk-rs ecosystem dropped GTK3 in
  # favor of GTK4 in 2024. Tauri 2 still pulls these on Linux because
  # webkit2gtk is GTK3-only. Tracked upstream at tauri-apps/tauri; will
  # clear when Tauri migrates to webkitgtk-6.0 / GTK4.
  "RUSTSEC-2024-0411",  # gdkwayland-sys
  "RUSTSEC-2024-0412",  # gdk
  "RUSTSEC-2024-0413",  # atk
  "RUSTSEC-2024-0414",  # gdkx11-sys
  "RUSTSEC-2024-0415",  # gtk
  "RUSTSEC-2024-0416",  # atk-sys
  "RUSTSEC-2024-0417",  # gdkx11
  "RUSTSEC-2024-0418",  # gdk-sys
  "RUSTSEC-2024-0419",  # gtk3-macros (or similar)
  "RUSTSEC-2024-0420",  # gtk-sys
  "RUSTSEC-2024-0429",  # glib VariantStrIter unsoundness — same upstream

  # Other unmaintained transitives.
  "RUSTSEC-2024-0370",  # proc-macro-error

  # zip 4.6.1 extraction flaws (symlinks and permissions escaping the target
  # directory). Pulled by tauri-plugin-updater 2.x on Windows only, to unpack
  # an update that arrives zipped; it only gets there after checking the
  # update's signature against our key, and ours ship as a plain .exe. Upstream
  # moved to zip 9 (tauri-apps/plugins-workspace#3698): drop these once a
  # release after tauri-plugin-updater 2.14.0 ships it.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
