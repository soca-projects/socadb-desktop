# cargo-about, run by scripts/acknowledgments.ts. The order is a preference:
# a crate under "MIT OR Apache-2.0" is credited under MIT, whose text is short
# and comes without NOTICE files to pass on. The npm packages use this list too.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "EPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
