[package]
name = "socadb-desktop"
version = "0.1.3"
description = "Database schema designer with AI CLI integration"
authors = ["Cassidy"]
edition = "2021"

[lib]
name = "socadb_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
dirs = "6"
tauri-plugin-opener = "2.5.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-sparkle-updater = { git = "https://github.com/Cassidy321/tauri-plugin-sparkle-updater", rev = "61f040d092581ff706590e7d25bd5128a0290d4c" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
