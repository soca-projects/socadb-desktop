[package]
name = "socadb-desktop"
version = "0.1.5"
description = "Database schema designer with AI CLI integration"
authors = ["Cassidy"]
edition = "2021"

[lib]
name = "socadb_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
toml_edit = "0.25"
futures-util = "0.3"
dirs = "6"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-log = "2.10.1"
log = "0.4"
os_info = { version = "3", default-features = false }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSFileManager", "NSLocale", "NSString", "NSURL"] }
plist = "1"
semver = "1"
tauri-plugin-sparkle-updater = { git = "https://github.com/Cassidy321/tauri-plugin-sparkle-updater", rev = "61f040d092581ff706590e7d25bd5128a0290d4c" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
